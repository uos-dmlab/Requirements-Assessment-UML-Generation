services:
  db:
    image: postgres:16-alpine
    container_name: umlreq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-umlreq}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [umlreq]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: umlreq-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [umlreq]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: umlreq-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASS:-postgres}@db:5432/${DB_NAME:-umlreq}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [umlreq]
    volumes:
      - app_data:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: umlreq-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks: [umlreq]

networks:
  umlreq:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_data:
